rules:
- id: call
  languages:
  - lua
  severity: INFO
  message: call
  pattern: $F(...)
- id: method_call
  languages:
  - lua
  severity: INFO
  message: method_call
  pattern: $O:$M(...)
- id: dot
  languages:
  - lua
  severity: INFO
  message: dot
  pattern: $X.$Y
- id: index
  languages:
  - lua
  severity: INFO
  message: index
  pattern: $T[$K]
- id: self_dot
  languages:
  - lua
  severity: INFO
  message: self_dot
  pattern: self.$X
- id: func_decl
  languages:
  - lua
  severity: INFO
  message: func_decl
  pattern: function $F(...) ... end
- id: local_func
  languages:
  - lua
  severity: INFO
  message: local_func
  pattern: local function $F(...) ... end
- id: method_decl
  languages:
  - lua
  severity: INFO
  message: method_decl
  pattern: function $T:$M(...) ... end
- id: lambda
  languages:
  - lua
  severity: INFO
  message: lambda
  pattern: function(...) ... end
- id: local_var
  languages:
  - lua
  severity: INFO
  message: local_var
  pattern: local $X = $V
- id: local_any
  languages:
  - lua
  severity: INFO
  message: local_any
  pattern: local $X
- id: assign
  languages:
  - lua
  severity: INFO
  message: assign
  pattern: $X = $V
- id: assign_nil
  languages:
  - lua
  severity: INFO
  message: assign_nil
  pattern: $X = nil
- id: return
  languages:
  - lua
  severity: INFO
  message: return
  pattern: return ...
- id: return_lambda
  languages:
  - lua
  severity: INFO
  message: return_lambda
  pattern: return function(...) ... end
- id: table
  languages:
  - lua
  severity: INFO
  message: table
  pattern: '{...}'
- id: if
  languages:
  - lua
  severity: INFO
  message: if
  pattern: if $C then ... end
- id: numfor
  languages:
  - lua
  severity: INFO
  message: numfor
  pattern: for $I = $A, $B do ... end
- id: genfor2
  languages:
  - lua
  severity: INFO
  message: genfor2
  pattern: for $K, $V in $E do ... end
- id: genfor1
  languages:
  - lua
  severity: INFO
  message: genfor1
  pattern: for $K in $E do ... end
- id: while
  languages:
  - lua
  severity: INFO
  message: while
  pattern: while $C do ... end
- id: repeat
  languages:
  - lua
  severity: INFO
  message: repeat
  pattern: repeat ... until $C
- id: do_block
  languages:
  - lua
  severity: INFO
  message: do_block
  pattern: do ... end
- id: string
  languages:
  - lua
  severity: INFO
  message: string
  pattern: '"..."'
- id: concat
  languages:
  - lua
  severity: INFO
  message: concat
  pattern: $A .. $B
- id: not
  languages:
  - lua
  severity: INFO
  message: not
  pattern: not $X
- id: len
  languages:
  - lua
  severity: INFO
  message: len
  pattern: '#$X'
- id: neg
  languages:
  - lua
  severity: INFO
  message: neg
  pattern: -$X
- id: eq
  languages:
  - lua
  severity: INFO
  message: eq
  pattern: $A == $B
- id: neq
  languages:
  - lua
  severity: INFO
  message: neq
  pattern: $A ~= $B
- id: lt
  languages:
  - lua
  severity: INFO
  message: lt
  pattern: $A < $B
- id: plus
  languages:
  - lua
  severity: INFO
  message: plus
  pattern: $A + $B
- id: and
  languages:
  - lua
  severity: INFO
  message: and
  pattern: $A and $B
- id: or
  languages:
  - lua
  severity: INFO
  message: or
  pattern: $A or $B
- id: nil
  languages:
  - lua
  severity: INFO
  message: nil
  pattern: nil
- id: 'true'
  languages:
  - lua
  severity: INFO
  message: 'true'
  pattern: 'true'
- id: 'false'
  languages:
  - lua
  severity: INFO
  message: 'false'
  pattern: 'false'
- id: break
  languages:
  - lua
  severity: INFO
  message: break
  pattern: break
- id: require
  languages:
  - lua
  severity: INFO
  message: require
  pattern: require(...)
- id: pcall
  languages:
  - lua
  severity: INFO
  message: pcall
  pattern: pcall(...)
- id: eq_nil
  languages:
  - lua
  severity: INFO
  message: eq_nil
  pattern: $X == nil
- id: vararg_call
  languages:
  - lua
  severity: INFO
  message: vararg_call
  pattern: $F(..., ...)
